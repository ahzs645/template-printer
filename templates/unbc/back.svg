<?xml version="1.0" encoding="UTF-8"?>
<!--
  UNBC student ID, back. Shared by every UNBC design and variant.

  Drawn in points: the canvas is 3.5 × 2.25 in and the card (data-trim-box)
  is the 3.375 × 2.125 in ID-1 rectangle inside it, with 1/16 in of bleed.

  guide_magnetic_stripe  where the card stock's magnetic stripe sits; shown
                         while editing, never printed (ink over a stripe can
                         stop it reading)
  barcode_codabar_studentId  generated Codabar of the record's studentId
  studentId              the same number, printed after the label
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 162" width="88.9mm" height="57.15mm" data-card-format="id-1" data-trim-box="4.5 4.5 243 153">
  <defs>
    <style>
      .cls-text { fill: #010101; font-family: HelveticaNeue, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .cls-medium { fill: #010101; font-family: HelveticaNeue-Medium, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 500; }
    </style>
  </defs>
  <rect id="artwork_background" x="0" y="0" width="252" height="162" fill="#ffffff"/>
  <g id="guide_magnetic_stripe" fill="#1a1a1a" fill-opacity="0.35">
    <rect x="0" y="16.34" width="252" height="36.46"/>
  </g>
  <g id="static_text">
    <text class="cls-medium" font-size="10" transform="translate(34.62 68.02)">University of Northern British Columbia</text>
    <text class="cls-text" font-size="7.04" transform="translate(46.87 76.95)">3333 University Way, Prince George, BC V2N 4Z9</text>
    <text class="cls-text" font-size="12.07" transform="translate(31.83 100.74)">Library Number: </text>
    <text class="cls-text" font-size="6.34" transform="translate(56.82 144.54)">NON-TRANSFERABLE - REPLACEMENT CHARGE</text>
  </g>
  <text id="studentId" class="cls-text" font-size="12.07" transform="translate(121.5 100.74)"><tspan x="0" y="0">230135918</tspan></text>
  <text id="barcode_codabar_studentId" class="cls-text" font-size="20" transform="translate(30.22 137.76)"><tspan x="0" y="0">230135918</tspan></text>
</svg>

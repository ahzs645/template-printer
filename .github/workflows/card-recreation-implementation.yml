name: Card recreation implementation
on:
  push:
    branches: [codex/card-recreation-workflow]
concurrency:
  group: card-recreation-implementation
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Apply reviewed source changes
        run: |
          if [ -f tools/apply-card-recreation.mjs ]; then node tools/apply-card-recreation.mjs; fi
          if [ -f tools/apply-card-recreation-fixes.mjs ]; then node tools/apply-card-recreation-fixes.mjs; fi
      - name: Typecheck
        working-directory: frontend
        run: pnpm exec tsc -b
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Regression tests
        working-directory: frontend
        run: pnpm test
      - name: Build
        working-directory: frontend
        run: pnpm build:local
      - name: Install browser verification tools
        run: |
          python -m pip install --quiet playwright==1.55.0 pypdfium2==4.30.0 pillow==11.3.0 pypdf==6.0.0
          python -m playwright install --with-deps chromium >/tmp/card-browser-install.log 2>&1 || { tail -80 /tmp/card-browser-install.log; exit 1; }
      - name: Real browser and PDF regression checks
        run: python frontend/scripts/test-card-browser.py
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-recreation-verification
          path: frontend/test-artifacts/card-recreation
          if-no-files-found: ignore
      - name: Persist verified source changes to this branch only
        if: success() && github.ref == 'refs/heads/codex/card-recreation-workflow'
        run: |
          if [ ! -f tools/apply-card-recreation.mjs ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- frontend/src frontend/scripts frontend/package.json docs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: integrate browser-verified card recreation workflow'
          git push origin HEAD:refs/heads/codex/card-recreation-workflow
